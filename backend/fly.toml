# fly.toml app configuration file generated for shoken-backend on 2026-01-23T01:44:29+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shoken-backend'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  RUST_LOG = 'warn,startup=info'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1 # cold start proxy error 回避のため常時 1 台を維持
  processes = ['app']

  [[http_service.checks]]
    interval = '60s'
    timeout = '3s'
    grace_period = '40s'
    method = 'GET'
    path = '/ready'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
