[package]
name = "backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[lints.clippy]
mod_module_files = "warn"

[target.'cfg(target_arch = "wasm32")'.dependencies]
axum = { version = "0.8.9", default-features = false, features = [
    "json",
    "multipart",
    "query",
] }
axum-extra = { version = "0.12", features = ["cookie"] }
tower-service = "0.3"
tower-http = { version = "0.7.0", features = ["cors", "limit", "request-id"] }
worker = { version = "0.8.7", features = ["http", "axum", "tokio-postgres"] }
worker-macros = { version = "0.8.7", features = ["http"] }
tokio-postgres = { version = "0.7", default-features = false, features = [
    "with-chrono-0_4",
    "with-uuid-1",
    "with-serde_json-1",
] }
postgres-types = "0.2"
bytes = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["arbitrary_precision"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std", "wasmbind"] }
rust_decimal = { version = "1", features = [
    "serde-float",
    "serde-arbitrary-precision",
] }
uuid = { version = "1.23.4", default-features = false, features = [
    "serde",
    "std",
    "v4",
    "js",
] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
# wasm-bindgen 必須: cookie の make_removal が OffsetDateTime::now_utc() を呼ぶため、
# 無効だと SystemTime::now() に落ちて wasm 上で panic する
time = { version = "0.3.51", features = ["wasm-bindgen"] }
futures-util = "0.3"
csv = "1.4"
encoding_rs = "0.8"
thiserror = "2.0.18"
tracing = "0.1.44"
validator = "0.21.0"
utoipa = { version = "6", features = ["chrono", "uuid"] }
url = "2.5"
wasm-bindgen-futures = "0.4"
shared = { path = "../shared", features = ["utoipa", "postgres", "validate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
encoding_rs = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["arbitrary_precision"] }
rust_decimal = { version = "1", features = ["serde-float", "serde-arbitrary-precision"] }
tokio-postgres = { version = "0.7", features = [
    "with-chrono-0_4",
    "with-uuid-1",
    "with-serde_json-1",
] }
# migrate bin・DB 統合テストなどホスト側ツールが直接接続するための pool/TLS
deadpool-postgres = "0.14"
postgres-native-tls = "0.5"
native-tls = "0.2"
postgres-types = "0.2"
bytes = "1"
crc = "3"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
validator = "0.21.0"
tower-http = { version = "0.7.0", features = ["cors"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
dotenvy = "0.15.7"
uuid = { version = "1.23.4", features = ["v4", "serde"] }
tracing = "0.1.44"
time = "0.3.51"
csv = "1.4"
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
url = "2.5"
futures-util = "0.3"
shared = { path = "../shared", features = ["utoipa", "postgres", "validate"] }
[dev-dependencies]
rust_decimal_macros = "1"
tower = "0.5.3"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
proptest = "1.11.0"
