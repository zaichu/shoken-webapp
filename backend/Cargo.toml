[package]
name = "backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[lints.clippy]
mod_module_files = "warn"

[target.'cfg(target_arch = "wasm32")'.dependencies]
axum = { version = "0.8.9", default-features = false }
tower-service = "0.3"
worker = { version = "0.8.7", features = ["http", "axum", "tokio-postgres"] }
worker-macros = { version = "0.8.7", features = ["http"] }
tokio-postgres = { version = "0.7", default-features = false, features = [
    "with-chrono-0_4",
    "with-uuid-1",
    "with-serde_json-1",
] }
postgres-types = "0.2"
bytes = "1"
serde_json = { version = "1.0.150", features = ["arbitrary_precision"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
rust_decimal = { version = "1", features = [
    "serde-float",
    "serde-arbitrary-precision",
] }
uuid = { version = "1.23.4", default-features = false, features = ["serde", "std"] }
wasm-bindgen-futures = "0.4"
shared = { path = "../shared", features = ["utoipa", "postgres", "validate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
encoding_rs = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["arbitrary_precision"] }
rust_decimal = { version = "1", features = ["serde-float", "serde-arbitrary-precision"] }
tokio-postgres = { version = "0.7", features = [
    "with-chrono-0_4",
    "with-uuid-1",
    "with-serde_json-1",
] }
deadpool-postgres = "0.14"
postgres-native-tls = "0.5"
native-tls = "0.2"
postgres-types = "0.2"
bytes = "1"
crc = "3"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
validator = "0.21.0"
tower-http = { version = "0.7.0", features = ["compression-gzip", "cors", "limit", "trace", "request-id"] }
governor = "0.10"
oauth2 = "5.0.0"
openidconnect = "4.0.1"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", features = ["json", "query"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
time = "0.3.51"
csv = "1.4"
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
sentry = "0.49"
url = "2.5"
futures = "0.3"
shared = { path = "../shared", features = ["utoipa", "postgres", "validate"] }
[dev-dependencies]
rust_decimal_macros = "1"
tower = "0.5.3"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
wiremock = "0.6"
temp-env = "0.3"
proptest = "1.11.0"
