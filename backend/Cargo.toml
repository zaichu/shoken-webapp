[package]
name = "backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart"] }
encoding_rs = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["arbitrary_precision"] }
rust_decimal = { version = "1", features = ["serde-float", "serde-arbitrary-precision"] }
rust_decimal_macros = "1"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "chrono",
    "uuid",
    "rust_decimal",
] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
validator = { version = "0.20.0", features = ["derive"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "limit", "trace", "request-id"] }
governor = "0.10"
oauth2 = "5.0.0"
dotenvy = "0.15.7"
mockall = "0.15.0"
hyper = "1.10.1"
async-trait = "0.1.89"
reqwest = { version = "0.13.4", features = ["json", "query"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
time = "0.3.51"
csv = "1.4"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
sentry = "0.48"
sentry-tower = "0.48"
url = "2.5"
futures = "0.3"
[dev-dependencies]
tokio-test = "0.4.5"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
wiremock = "0.6"
temp-env = "0.3"
