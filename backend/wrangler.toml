name = "shoken-backend"
main = "build/index.js"
compatibility_date = "2026-10-08"
workers_dev = true

# wrangler dev 用の非シークレット設定。本番値は deploy 用の env セクション/CI で注入する
[vars]
APP_ENV = "development"
BACKEND_URL = "http://localhost:8787"
FRONTEND_URL = "http://localhost:8081"

# GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET は backend/.dev.vars に置く(gitignore 済み)

# id は実デプロイ前に `wrangler hyperdrive create` で発行した値に置き換える。
# `wrangler dev` では localConnectionString へ直接接続する(docker-compose の PG と同一資格情報)
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
localConnectionString = "postgres://user:password@127.0.0.1:5432/shoken_db?sslmode=disable"

# Cloudflare のレート制限は simple { limit, period(10 or 60s) } でしか設定できないため、
# Fly 側の「リクエスト/秒」を 10 秒窓に換算する(auth 10rps -> 100/10s など)。
# namespace_id は dev では任意値でよく、実デプロイ前に正規の値へ置き換える
[[ratelimits]]
name = "RATE_LIMIT_AUTH"
namespace_id = "1001"
simple = { limit = 100, period = 10 }

[[ratelimits]]
name = "RATE_LIMIT_CSV"
namespace_id = "1002"
simple = { limit = 20, period = 10 }

[[ratelimits]]
name = "RATE_LIMIT_STOCK_SEARCH"
namespace_id = "1003"
simple = { limit = 100, period = 10 }

[[ratelimits]]
name = "RATE_LIMIT_DATA"
namespace_id = "1004"
simple = { limit = 100, period = 10 }

[build]
command = "worker-build --release"
