name = "shoken-backend"
main = "build/index.js"
compatibility_date = "2026-10-08"
workers_dev = true

# 既定(無印 deploy)は本番として扱う。APP_ENV 未設定時は RuntimeEnv が
# Production へフォールする(fail-safe)。本番用の vars / secrets は
# カットオーバー時に [env.<name>] や CI の --var / wrangler secret で注入する。
# GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET は backend/.dev.vars に置く(gitignore 済み)

# id は実デプロイ前に `wrangler hyperdrive create` で発行した値に置き換える
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"

# Cloudflare のレート制限は simple { limit, period(10 or 60s) } でしか設定できないため、
# Fly 側の「リクエスト/秒」を 10 秒窓に換算する(auth 10rps -> 100/10s など)。
# namespace_id は dev では任意値でよく、実デプロイ前に正規の値へ置き換える
[[ratelimits]]
name = "RATE_LIMIT_AUTH"
namespace_id = "1001"
simple = { limit = 100, period = 10 }

[[ratelimits]]
name = "RATE_LIMIT_CSV"
namespace_id = "1002"
simple = { limit = 20, period = 10 }

[[ratelimits]]
name = "RATE_LIMIT_STOCK_SEARCH"
namespace_id = "1003"
simple = { limit = 100, period = 10 }

[[ratelimits]]
name = "RATE_LIMIT_DATA"
namespace_id = "1004"
simple = { limit = 100, period = 10 }

# 毎分実行し、配当キャッシュの stale/pending 銘柄を消化する。
# もう1本は UTC 07:00（JST 16:00・東証引け後）に保有銘柄の現在値を更新する。
# named env はトップレベルの triggers を継承しないため env.dev にも定義する
[triggers]
crons = ["* * * * *", "0 7 * * *"]

[build]
command = "worker-build --release"

# ---- ローカル開発(`wrangler dev --env dev` / `make worker-dev`) ----
# wrangler の named env はトップレベルの bindings/vars を継承しないため、
# dev で使うものはここにすべて再定義する
[env.dev.vars]
APP_ENV = "development"
BACKEND_URL = "http://localhost:8787"
FRONTEND_URL = "http://localhost:8081"

# `wrangler dev` では localConnectionString へ直接接続する(docker-compose の PG と同一資格情報)
[[env.dev.hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
localConnectionString = "postgres://user:password@127.0.0.1:5432/shoken_db?sslmode=disable"

[[env.dev.ratelimits]]
name = "RATE_LIMIT_AUTH"
namespace_id = "1001"
simple = { limit = 100, period = 10 }

[[env.dev.ratelimits]]
name = "RATE_LIMIT_CSV"
namespace_id = "1002"
simple = { limit = 20, period = 10 }

[[env.dev.ratelimits]]
name = "RATE_LIMIT_STOCK_SEARCH"
namespace_id = "1003"
simple = { limit = 100, period = 10 }

[[env.dev.ratelimits]]
name = "RATE_LIMIT_DATA"
namespace_id = "1004"
simple = { limit = 100, period = 10 }

[env.dev.triggers]
crons = ["* * * * *", "0 7 * * *"]
