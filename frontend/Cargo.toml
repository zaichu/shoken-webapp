[package]
name = "frontend"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[lints.clippy]
mod_module_files = "warn"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.4", features = ["futures"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
rust_decimal = { version = "1", default-features = false, features = ["serde-float", "serde-arbitrary-precision"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Element", "SubmitEvent", "FormData", "File", "FileList", "Blob", "Url", "Node", "NodeList", "AbortController", "RequestCredentials", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "Event", "InputEvent", "MouseEvent", "Storage", "BroadcastChannel", "MessageEvent", "console", "MediaQueryList", "MediaQueryListEvent", "DomRect", "Navigator", "ResizeObserver", "ResizeObserverEntry", "ScrollIntoViewOptions", "ScrollLogicalPosition", "DragEvent", "DataTransfer"] }
console_error_panic_hook = "0.1"
encoding_rs = "0.8"
shared = { path = "../shared" }
send_wrapper = "0.6"

[dev-dependencies]
rust_decimal_macros = "1"
any_spawner = { version = "0.3", features = ["futures-executor"] }
# fork/timeout が wasm32 非対応の wait-timeout 等を引くため切る。
proptest = { version = "1.11.0", default-features = false, features = ["std", "bit-set"] }
time = "0.3.51"

# proptest → rand_core 由来の getrandom に wasm_js feature を有効化する(feature は同一バージョンにしか届かないため 0.3 と 0.4 の両方が要る)。backend 選択の cfg は .cargo/config.toml の rustflag。
# 同一テーブル内のキー重複は書けないため、同じ条件を語順違いで2テーブルに分けている
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
# proptest 1.12 以降は rand 0.10 経由で getrandom 0.4 が wasm32 の依存に入る
[target.'cfg(all(target_os = "unknown", target_arch = "wasm32"))'.dev-dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }


# 開発ビルドはパニック時の行番号が読める範囲までデバッグ情報を残し、target を小さく保つ
[profile.dev]
debug = "line-tables-only"

# 依存クレートの中まで追うことはないので、依存のデバッグ情報は持たない
[profile.dev.package."*"]
debug = false

# テストビルドも同じ方針にする
[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
