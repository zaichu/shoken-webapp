[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
rust_decimal = { version = "1", default-features = false, features = ["serde-float", "serde-arbitrary-precision"] }
urlencoding = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element", "SubmitEvent", "FormData", "Blob", "File", "FileList", "Node", "NodeList", "AbortController", "AbortSignal", "RequestCredentials", "HtmlElement", "HtmlInputElement", "HtmlButtonElement", "KeyboardEvent", "Event", "EventTarget", "MouseEvent", "HtmlDivElement", "Navigator", "Clipboard", "Storage", "StorageEvent", "BroadcastChannel", "MessageEvent", "console", "History", "MediaQueryList", "DomRect", "DomRectReadOnly", "ResizeObserver", "ResizeObserverEntry", "ScrollIntoViewOptions", "ScrollLogicalPosition"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
rust_decimal_macros = "1"
any_spawner = { version = "0.3", features = ["futures-executor"] }
# fork/timeout が wasm32 非対応の wait-timeout 等を引くため切る。
proptest = { version = "1.11.0", default-features = false, features = ["std", "bit-set"] }
time = "0.3.51"

# proptest 由来の getrandom が wasm32 で backend 未選択になるため wasm_js を有効化する。
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
