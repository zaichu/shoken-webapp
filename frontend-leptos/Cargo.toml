[package]
name = "leptos-search"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.6", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "SubmitEvent"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
