[package]
name = "frontend-leptos"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
rust_decimal = { version = "1", features = ["serde-float", "serde-arbitrary-precision"] }
urlencoding = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "SubmitEvent", "FormData", "AbortController", "AbortSignal", "RequestCredentials"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
rust_decimal_macros = "1"


[profile.release]
opt-level = "z"
lto = true
