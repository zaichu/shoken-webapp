# DB を使う統合テストは #[ignore] 済みのため、ユニットテストだけを mutant 評価の対象にする
additional_cargo_test_args = ["--lib"]

# mutant 名(file:line:col: description)にマッチする正規表現で除外する。
# 除外理由:
# - エントリポイント・一時スクリプト: プロセス起動を伴いユニットテストでは検証不可
# - DB 境界: sqlx::query! が実 DB を必要とし --lib 実行ではテストできない
# - 外部ネットワーク: Google OAuth/JWKS のトークン交換・鍵取得
# - 等価 mutant: 境界条件が取り得ない等、振る舞いが変わらないもの
exclude_re = [
    # エントリポイント・CLI スクリプト
    "backend/src/main\\.rs",
    "backend/src/bin/",
    # ロギング初期化(プロセス全体の副作用)
    "init_tracing",
    # レート制限クリーンアップのバックグラウンド spawn(タイミング依存)
    "spawn_keyed_limiter_cleanup",
    # DB 接続リトライ・マイグレーション(実 DB 前提。
    # 接続リトライは tests/db_migration.rs の接続・マイグレーション系テスト
    # で検証。run_migrations は全統合テストが経由するため実質検証済み)
    "wait_for_pool_with_retry",
    "run_migrations",
    # Google OAuth 外部境界(JWKS 取得・トークン交換・セッション永続化はいずれも
    # 外部ネットワークまたは実 DB を前提とし、ユニットテストでは置換 mutant を倒せない)
    "build_oauth_http_client",
    "shared_google_jwks",
    "authenticate_with_google_code",
    "replace google_callback",
    # DB 前提のセッション/アカウント操作(services/auth.rs に限定。
    # 同名のハンドラは 401/認証テストで評価できるため除外しない。
    # 振る舞いは tests/db_auth_session.rs::auth_session_upsert_rotate_and_delete で検証済み)
    "backend/src/services/auth\\.rs.*upsert_user_and_rotate_session",
    "backend/src/services/auth\\.rs.*select_user_by_session",
    "backend/src/services/auth\\.rs.*select_user_id_by_session",
    "backend/src/services/auth\\.rs.*rotate_session_in_tx",
    "backend/src/services/auth\\.rs.*delete_session",
    "backend/src/services/auth\\.rs.*delete_account",
    # 操作記録・セッション削除・端末解除はDB Tx境界。
    # 振る舞いはDocker統合テスト(db_auth_session・db_rls)で検証する。
    "backend/src/services/auth\\.rs.*delete_all_sessions",
    "backend/src/services/auth\\.rs.*delete_device_sessions",
    "backend/src/services/operation_log\\.rs.*list",
    "backend/src/services/login_event/devices\\.rs.*revoke_device",
    # DB 前提のファセット/一括削除(DB 統合テストは #[ignore] のため評価対象外。
    # 振る舞いは tests/db_bulk.rs の service_coverage_all_domains /
    # search_facets_group_by_domain_fields で検証済み。
    # models の should_include_facets や handlers の delete_all は評価可能なため
    # services/ の関数に限定する)
    "backend/src/services/.*facets",
    # 国内株式の集計 SQL は services/domestic_stock.rs の
    # test_search_summary_matches_frontend_daily_tax_calculation(Docker)で値を検証済み
    "backend/src/services/domestic_stock\\.rs.*fetch_summary",
    # 配当の集計 fetch_aggregates は DB 境界(結合テストは #[ignore] のため --lib 評価では観測不可。
    # ARRAY_AGG 除去後の DISTINCT ON 分割の等価性は使い捨て DB での新旧 SQL 比較と
    # tests/db_bulk.rs::search_facets_group_by_domain_fields(Docker)で検証済み)
    "backend/src/services/dividend\\.rs.*fetch_aggregates",
    "backend/src/services/.*delete_all ->",
    "delete ! in bulk_create",
    "delete_all_for_user",
    # dividend キャッシュ: DB + 外部 API( J-Quants )前提。
    # get_batch/acquire_rate_slot/update_cache_error* の DB 経路は
    # tests/db_price.rs::dividend_cache_persistence_and_rate_slot で検証済み。
    # fetch_and_cache は J-Quants 外部境界、push_rate_control_cooldown は
    # 429 時専用の内部関数で到達に外部失敗が必要なため除外維持
    "get_batch",
    "acquire_rate_slot",
    "push_rate_control_cooldown",
    "spawn_background_refresh",
    "fetch_and_cache",
    "update_cache_error",
    # 等価 mutant(演算子置換のみに限定し、関数全体の置換は対象に残す)
    # JWKS TTL ちょうどの境界(Instant::elapsed が正確に TTL に一致する時刻は作れない)
    "replace < with <= in GoogleJwksCache::get",
    # pnl=0 のとき税額はどちらでも 0、pnl>0 と同じ結果になる
    "replace <= with < in tax_amount",
    # 分割後のトークン数は常に >=1 で、> と >= は同値
    "replace > with >= in normalize_security_name",
    # elapsed_ms はログ出力のみでレスポンスに影響しない(* → + / / のみ。
    # skipped の算術や finish_from_result の置換はテスト可能なため残す)
    "replace \\* with [+/] in BulkTimer::finish$",
    # 本体は既に空の Router::new() であり Default::default() と等価
    "replace csv_import_routes",
    "replace > with >= in normalize_security_name",
    # ログインイベントの DB 境界(結合テストは #[ignore] のため --lib 評価では観測不可。
    # 振る舞いは services/login_event.rs の history_and_devices_are_scoped_to_owner /
    # revoked_device_leaves_device_list / old_rows_are_pruned_and_ip_column_is_absent
    # (Docker)で検証済み。SQL・判定条件は不変。ハンドラの同名関数は除外しない)
    "backend/src/services/login_event/devices\\.rs.*replace (fetch_device_rows|list_devices|fetch_device_hashes|resolve_device_hash) -> ",
    # Docker 統合テストでのみ検証できる操作記録/端末失効の DB Tx。
    # prune_old_tokens_and_views は services/login_notify.rs の
    # old_tokens_and_views_are_pruned_and_recent_rows_remain(Docker)で検証済み。
    "backend/src/services/auth\\.rs.*(delete_all_sessions|delete_device_sessions) -> ",
    "backend/src/services/operation_log\\.rs.*(record|list|prune) -> ",
    "backend/src/services/login_notify\\.rs.*prune_old_tokens_and_views -> ",
    "backend/src/services/login_event/devices\\.rs.*revoke_device -> ",
    "backend/src/services/login_event/history\\.rs.*replace (list_login_history|insert_login_event_row|trim_login_events_to_cap|insert_login_event_in_tx|prune_login_events) -> ",
    # Worker scheduled entrypoint は wasm target のみで有効。
    "backend/src/worker_entry\\.rs",
    # 株価・基準価額 cron の DB 境界(結合テストは #[ignore] のため --lib 評価では観測不可。
    # 対象選定・試行時刻の前進・失敗記録の SQL 実行は実 DB 前提。
    # 振る舞いは tests/db_price.rs::stock_price_refresh_cycles_past_failing_codes /
    # fund_price_refresh_records_failure_and_marks_attempted(Docker)で検証済み。
    # 純粋な判定(none_succeeded/scheduled_time_ms/upstream_status_error/
    # short_failure_reason のホスト系)は services/price_cron.rs の単体テストで評価するため除外しない)
    "backend/src/services/price_cron\\.rs.*(select_targets|record_failure|clear_failure)",
    "delete ! in select_targets",
    "backend/src/services/fund_price\\.rs.*(record_fetch_failure|clear_fetch_error|refresh_fund_prices)",
    "backend/src/services/stock_price\\.rs.*refresh_stock_prices",
    # 等価 mutant。short_failure_reason の Transport 系は wasm でのみ存在し、
    # ホストの --lib 評価では腕自体がコンパイルされないため削除が無意味
    "Transport.* in short_failure_reason",
    # 等価 mutant。clamp_history_offset は Some(0) も 0 を返すため > と >= は同値
    "replace > with >= in clamp_history_offset",
    # 等価 mutant。CsvImport::ensure_importable の既定実装は無条件に Ok を返すため、
    # 本体を Ok(()) に置き換えても振る舞いは変わらない
    "replace CsvImport::ensure_importable -> Result<\\(\\), ApiError> with Ok\\(\\(\\)\\)",
]
