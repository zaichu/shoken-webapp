name: Setup Playwright environment
description: Playwright のブラウザと APT 依存をキャッシュ付きで用意する

outputs:
  browsers_cache_hit:
    value: ${{ steps.playwright-browsers.outputs.cache-hit }}
  apt_cache_hit:
    value: ${{ steps.apt-packages.outputs.cache-hit }}
  apt_cache_key:
    value: ${{ steps.apt-packages.outputs.cache-primary-key }}
  browsers_cache_key:
    value: ${{ steps.playwright-browsers.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      working-directory: frontend
      run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright browsers cache
      id: playwright-browsers
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-browsers-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-playwright-browsers-

    - name: Restore APT packages cache
      id: apt-packages
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
      with:
        path: ~/apt-packages
        key: ${{ runner.os }}-apt-playwright-ubuntu24.04-${{ hashFiles('.github/actions/setup-playwright/action.yml') }}-tmpmiss1
        restore-keys: |
          ${{ runner.os }}-apt-playwright-ubuntu24.04-

    - name: Install APT packages (Playwright deps)
      if: steps.apt-packages.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/apt-packages/partial
        sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ftp::Timeout=30
        sudo apt-get install -y -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ftp::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-packages xvfb fonts-noto-color-emoji fonts-unifont libfontconfig1 libfreetype6 xfonts-cyrillic xfonts-scalable fonts-liberation fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
        # apt-get は root で動くため保存前に所有者を戻す(読めないと tar が失敗し保存されない)
        sudo chown -R "$(id -u):$(id -g)" ~/apt-packages

    - name: Install APT packages from cache (offline)
      if: steps.apt-packages.outputs.cache-hit == 'true'
      shell: bash
      run: |
        # キャッシュ命中時はミラーに触れず保存済み .deb を直接入れる
        sudo dpkg -i ~/apt-packages/*.deb

    - name: Install Playwright browser
      if: steps.playwright-browsers.outputs.cache-hit != 'true'
      shell: bash
      working-directory: frontend
      run: npx playwright install chromium
