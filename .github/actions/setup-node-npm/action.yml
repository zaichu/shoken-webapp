name: Setup Node and install frontend dependencies
description: setup-node(npm キャッシュ付き)と npm ci をまとめる

runs:
  using: composite
  steps:
    - name: Setup frontend dependencies
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      shell: bash
      working-directory: frontend
      run: npm ci
