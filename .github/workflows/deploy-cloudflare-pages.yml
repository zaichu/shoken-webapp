name: Cloudflare Pages Deploy

on:
  workflow_call:
    inputs:
      use_prebuilt_dist:
        description: Frontend CI の cloudflare-dist artifact を再利用し、ビルドを省略する
        type: boolean
        required: true
        default: false
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/deploy-cloudflare-pages.yml'
      - '.github/actions/rust-cache/**'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-secrets:
    name: Check Cloudflare secrets
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets presence
        id: check
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then
              missing="${missing} ${name}"
            fi
          done
          if [[ -n "${missing}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare シークレットが未登録です(${missing# })。デプロイをスキップします"
            echo "Cloudflare シークレットが未登録です(\`${missing# }\`)。デプロイはスキップされました(失敗ではありません)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build and deploy to Cloudflare Pages
    needs: [cloudflare-secrets]
    if: >-
      needs.cloudflare-secrets.outputs.available == 'true'
      && ((github.event_name == 'pull_request'
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association))
        || github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    concurrency:
      group: cloudflare-pages-deploy-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7

      # CI 呼び出し時は Frontend CI が検証済みの成果物をそのままデプロイする(二重ビルドをしない)
      - name: Download Cloudflare dist artifact
        if: inputs.use_prebuilt_dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 https://github.com/actions/download-artifact/releases/tag/v8.0.1
        with:
          name: cloudflare-dist
          path: frontend/dist

      - name: Setup Rust
        if: inputs.use_prebuilt_dist != true
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0 https://github.com/actions-rust-lang/setup-rust-toolchain/releases/tag/v2.0.0
        with:
          cache: false
          target: wasm32-unknown-unknown

      - name: Cache Cargo
        if: inputs.use_prebuilt_dist != true
        uses: ./.github/actions/rust-cache
        with:
          workspaces: frontend -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install trunk
        if: inputs.use_prebuilt_dist != true
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfLO https://github.com/trunk-rs/trunk/releases/download/v0.21.4/trunk-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfLO https://github.com/trunk-rs/trunk/releases/download/v0.21.4/trunk-x86_64-unknown-linux-gnu.tar.gz.sha256
          echo "$(tr -d '[:space:]' < trunk-x86_64-unknown-linux-gnu.tar.gz.sha256)  trunk-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf trunk-x86_64-unknown-linux-gnu.tar.gz
          install -m 755 trunk ~/.cargo/bin/

      - name: Setup frontend dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 https://github.com/actions/setup-node/releases/tag/v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: inputs.use_prebuilt_dist != true
        run: npm ci

      - name: Install wrangler
        run: npm install -g wrangler@4.18.0 # https://github.com/cloudflare/wrangler/releases/tag/wrangler%404.18.0

      - name: Determine deploy target
        id: target
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Build output (trunk build)
        if: inputs.use_prebuilt_dist != true
        env:
          TRUNK_REUSE_DIST: ${{ inputs.use_prebuilt_dist }}
        run: |
          trunk build --release --dist dist

      - name: Prepare Cloudflare delivery bundle
        if: inputs.use_prebuilt_dist != true
        run: |
          node scripts/prepare-vercel-dist.mjs dist

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          if [[ "${{ steps.target.outputs.environment }}" == "production" ]]; then
            # 本番デプロイ: project name を指定
            url="$(wrangler pages deploy dist --project-name=shoken-webapp --commit-dirty=true 2>&1 | grep -oE 'https://[^ ]+\.pages\.dev' | tail -n1)"
          else
            # プレビューデプロイ: ブランチ名を指定
            branch="${GITHUB_REF##refs/heads/}"
            branch="${branch//\//-}"
            url="$(wrangler pages deploy dist --project-name=shoken-webapp --branch="${branch}" --commit-dirty=true 2>&1 | grep -oE 'https://[^ ]+\.pages\.dev' | tail -n1)"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed (${{ steps.target.outputs.environment }}): ${url}" >> "$GITHUB_STEP_SUMMARY"

      # synchronize ごとに新規コメントすると URL が積み上がるため、マーカー付きコメントを上書きする
      - name: Comment preview URL on PR
        if: github.event.pull_request != null && steps.deploy.outputs.url != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="<!-- cloudflare-pages-preview-url -->"
          body="${marker}
          Cloudflare Pages preview: ${{ steps.deploy.outputs.url }}"
          # --paginate はページ単位で jq 評価するため、各ページの一致 ID を最終行だけ採用する
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | tail -n1)
          if [[ -n "${existing}" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="${body}" > /dev/null
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "${body}"
          fi