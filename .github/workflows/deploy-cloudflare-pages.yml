name: Cloudflare Pages Deploy

on:
  workflow_call:
    inputs:
      use_prebuilt_dist:
        description: Frontend CI の cloudflare-dist artifact を再利用し、ビルドを省略する
        type: boolean
        required: true
        default: false
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/deploy-cloudflare-pages.yml'
      - '.github/actions/rust-cache/**'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-secrets:
    name: Check Cloudflare secrets
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    # 有無の確認だけなので値は env に置かず、式で真偽だけを受け取る
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Check secrets presence
        id: check
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            flag="HAS_${name}"
            if [[ "${!flag}" != "true" ]]; then
              missing="${missing} ${name}"
            fi
          done
          if [[ -n "${missing}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare シークレットが未登録です(${missing# })。デプロイをスキップします"
            echo "Cloudflare シークレットが未登録です(\`${missing# }\`)。デプロイはスキップされました(失敗ではありません)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

  # PR のコードを実行するビルドと secret を使うデプロイは別ジョブ(別ランナー)に分ける。
  # 同一ジョブだとビルド側が $GITHUB_PATH で後続ステップの PATH を改変でき、
  # secret が載った wrangler 呼び出しを偽バイナリに差し替えられるため
  build:
    name: Build frontend dist
    needs: [cloudflare-secrets]
    if: >-
      needs.cloudflare-secrets.outputs.available == 'true'
      && inputs.use_prebuilt_dist != true
      && ((github.event_name == 'pull_request'
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association))
        || github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0 https://github.com/actions-rust-lang/setup-rust-toolchain/releases/tag/v2.0.0
        with:
          cache: false
          target: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: ./.github/actions/rust-cache
        with:
          workspaces: frontend -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install trunk
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfLO https://github.com/trunk-rs/trunk/releases/download/v0.21.4/trunk-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfLO https://github.com/trunk-rs/trunk/releases/download/v0.21.4/trunk-x86_64-unknown-linux-gnu.tar.gz.sha256
          echo "$(tr -d '[:space:]' < trunk-x86_64-unknown-linux-gnu.tar.gz.sha256)  trunk-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf trunk-x86_64-unknown-linux-gnu.tar.gz
          install -m 755 trunk ~/.cargo/bin/

      - name: Setup frontend dependencies
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build output (trunk build)
        run: trunk build --release --dist dist

      - name: Prepare Cloudflare delivery bundle
        run: node scripts/prepare-dist.mjs dist

      - name: Upload Pages dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 https://github.com/actions/upload-artifact/releases/tag/v7
        with:
          name: pages-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [cloudflare-secrets, build]
    # use_prebuilt_dist では build が skip されるため、結果ではなく入力で成功判定を分ける
    if: >-
      always()
      && needs.cloudflare-secrets.outputs.available == 'true'
      && (inputs.use_prebuilt_dist == true || needs.build.result == 'success')
      && ((github.event_name == 'pull_request'
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association))
        || github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    concurrency:
      group: cloudflare-pages-deploy-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # CI 呼び出し時は Frontend CI が検証済みの成果物(cloudflare-dist)をそのまま使う。
      # PR のコードはこのジョブに持ち込まない(checkout もしない)
      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: ${{ inputs.use_prebuilt_dist == true && 'cloudflare-dist' || 'pages-dist' }}
          path: dist

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install -g wrangler@4.18.0 # https://github.com/cloudflare/wrangler/releases/tag/wrangler%404.18.0

      - name: Determine deploy target
        id: target
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
          fi

      # concurrency の待機順は開始順と限らないため、古い実行が新しいコミットの
      # プレビューを上書きしないよう deploy 直前に起点 SHA がまだ最新か確かめる
      - name: Check the triggering commit is still latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            latest="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}" --jq '.head.sha')"
            expected="${{ github.event.pull_request.head.sha }}"
          else
            latest="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${{ github.ref_name }}" --jq '.sha')"
            expected="${{ github.sha }}"
          fi
          if [[ "${latest}" != "${expected}" ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::新しいコミットがあるためこの実行のデプロイをスキップします"
          fi

      # 未作成だと deploy が code 8000007 で失敗するため、無ければ作る(既存なら警告だけで続行)
      - name: Ensure Cloudflare Pages project exists
        if: steps.latest.outputs.stale != 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          log_file="${RUNNER_TEMP}/wrangler-project-create.log"
          if wrangler pages project create shoken-webapp --production-branch=main > "${log_file}" 2>&1; then
            cat "${log_file}"
          else
            cat "${log_file}"
            echo "::warning::Pages プロジェクトの作成に失敗しました。既存の場合は deploy に進みます"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.latest.outputs.stale != 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          log_file="${RUNNER_TEMP}/wrangler-deploy.log"
          deploy_exit=0
          if [[ "${{ steps.target.outputs.environment }}" == "production" ]]; then
            wrangler pages deploy dist --project-name=shoken-webapp --commit-dirty=true > "${log_file}" 2>&1 || deploy_exit=$?
          else
            branch="${GITHUB_REF##refs/heads/}"
            branch="${branch//\//-}"
            wrangler pages deploy dist --project-name=shoken-webapp --branch="${branch}" --commit-dirty=true > "${log_file}" 2>&1 || deploy_exit=$?
          fi
          cat "${log_file}"
          url="$(grep -oE 'https://[^ ]+\.pages\.dev' "${log_file}" | tail -n1)"
          if [[ ${deploy_exit} -ne 0 ]] || [[ -z "${url}" ]]; then
            echo "::error::Cloudflare Pages deployment failed (exit ${deploy_exit}, no URL returned)"
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed (${{ steps.target.outputs.environment }}): ${url}" >> "$GITHUB_STEP_SUMMARY"

      # synchronize ごとに新規コメントすると URL が積み上がるため、マーカー付きコメントを上書きする
      - name: Comment preview URL on PR
        if: github.event.pull_request != null && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="<!-- cloudflare-pages-preview-url -->"
          body="${marker}
          Cloudflare Pages preview: ${{ steps.deploy.outputs.url }}"
          # --paginate はページ単位で jq 評価するため、各ページの一致 ID を最終行だけ採用する
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | tail -n1)
          if [[ -n "${existing}" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="${body}" > /dev/null
          else
            # deploy ジョブは checkout しないため、gh が git remote からリポジトリを解決できず -R が要る
            gh pr comment "${{ github.event.pull_request.number }}" -R "${GITHUB_REPOSITORY}" --body "${body}"
          fi
