name: Backend CI / Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect backend changes
        id: detect
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run_backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_REF="origin/${{ github.base_ref }}"
          echo "Comparing ${BASE_REF}...HEAD for backend-related changes"
          CHANGED=$(git diff --name-only "${BASE_REF}...HEAD" -- \
            backend .github/workflows/deploy-backend.yml)

          if [ -n "$CHANGED" ]; then
            echo "backend changes found:"
            echo "$CHANGED"
            echo "run_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "no backend changes: skipping heavy steps"
            echo "run_backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust toolchain
        if: steps.detect.outputs.run_backend == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Cargo registry & build
        if: steps.detect.outputs.run_backend == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Lint (clippy)
        if: steps.detect.outputs.run_backend == 'true'
        run: cargo clippy -- -D warnings

      - name: Run tests
        if: steps.detect.outputs.run_backend == 'true'
        run: cargo test

      - name: Check release build
        if: steps.detect.outputs.run_backend == 'true'
        run: cargo check --release

      - name: Generate OpenAPI schema
        if: steps.detect.outputs.run_backend == 'true'
        run: cargo run --bin generate_openapi

      - name: Check OpenAPI schema is up to date
        if: steps.detect.outputs.run_backend == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code docs/openapi.json; then
            echo "openapi.json が古い状態です。cargo run --bin generate_openapi を実行してコミットしてください。"
            exit 1
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.run_backend == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.detect.outputs.run_backend == 'true'
        working-directory: ${{ github.workspace }}/frontend
        run: npm ci

      - name: Generate frontend types
        if: steps.detect.outputs.run_backend == 'true'
        working-directory: ${{ github.workspace }}/frontend
        run: npm run generate:types

      - name: Check frontend types are up to date
        if: steps.detect.outputs.run_backend == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code frontend/src/generated/api.ts; then
            echo "api.ts が古い状態です。npm run generate:types を実行してコミットしてください。"
            exit 1
          fi

      - name: TypeScript type check
        if: steps.detect.outputs.run_backend == 'true'
        working-directory: ${{ github.workspace }}/frontend
        run: npx tsc --noEmit

  deploy:
    name: Deploy to Fly.io
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy to Fly.io
        id: fly-deploy
        run: flyctl deploy --remote-only
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Stopped machine recovery
        if: steps.fly-deploy.outcome == 'failure'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "=== flyctl deploy 失敗: stopped machine recovery を試みます ==="

          # 新しい GH_SHA の machine 情報を一括取得
          MACHINE_LIST=$(flyctl machine list --json)
          MACHINE_IDS=$(echo "$MACHINE_LIST" | jq -r --arg sha "$GH_SHA" \
            '.[] | select(.image_ref.labels.GH_SHA == $sha) | .id')

          if [ -z "$MACHINE_IDS" ]; then
            echo "エラー: GH_SHA=$GH_SHA の machine が存在しません"
            echo "=== 全 machine 一覧 ==="
            echo "$MACHINE_LIST" | jq '.[] | {id, state, sha: .image_ref.labels.GH_SHA, checks}'
            exit 1
          fi

          echo "対象 machine: $(echo "$MACHINE_IDS" | tr '\n' ' ')"

          # stopped machine を start する
          while IFS= read -r id; do
            STATE=$(echo "$MACHINE_LIST" | jq -r --arg id "$id" '.[] | select(.id == $id) | .state')
            if [ "$STATE" = "stopped" ]; then
              echo "Machine $id を起動します..."
              flyctl machine start "$id"
            else
              echo "Machine $id の現在の状態: $STATE (start スキップ)"
            fi
          done <<< "$MACHINE_IDS"

          # started + health check passing になるまで待機
          MAX_WAIT=180
          INTERVAL=10
          ELAPSED=0

          until [ "$ELAPSED" -ge "$MAX_WAIT" ]; do
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
            echo "--- ${ELAPSED}s 経過 ---"

            CURRENT_LIST=$(flyctl machine list --json)
            ALL_HEALTHY=true

            while IFS= read -r id; do
              INFO=$(echo "$CURRENT_LIST" | jq --arg id "$id" '.[] | select(.id == $id)')
              STATE=$(echo "$INFO" | jq -r '.state')
              CHECK_COUNT=$(echo "$INFO" | jq '.checks | length')
              FAILING=$(echo "$INFO" | jq '[.checks[]? | select(.status != "passing")] | length')
              echo "Machine $id: state=$STATE checks=$CHECK_COUNT failing=$FAILING"

              if [ "$STATE" != "started" ] || [ "$FAILING" -gt 0 ]; then
                ALL_HEALTHY=false
              fi
            done <<< "$MACHINE_IDS"

            if [ "$ALL_HEALTHY" = "true" ]; then
              echo "=== Recovery 成功: GH_SHA=$GH_SHA の machine が started + passing になりました ==="
              exit 0
            fi
          done

          echo "=== Recovery 失敗: ${MAX_WAIT}s でタイムアウト ==="
          echo "=== GH_SHA=$GH_SHA の machine 最終状態 ==="
          flyctl machine list --json | jq --arg sha "$GH_SHA" \
            '[.[] | select(.image_ref.labels.GH_SHA == $sha) | {id, state, checks}]'
          exit 1
