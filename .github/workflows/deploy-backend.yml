name: Backend CI / Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    outputs:
      backend: ${{ steps.detect.outputs.backend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7
        with:
          fetch-depth: 1

      - name: Detect backend changes
        id: detect
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3 https://github.com/dorny/paths-filter/releases/tag/v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy-backend.yml'

      - name: Setup Rust toolchain
        if: steps.detect.outputs.backend == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1 https://github.com/actions-rust-lang/setup-rust-toolchain/releases/tag/v1

      - name: Cache Rust dependencies
        if: steps.detect.outputs.backend == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1 https://github.com/Swatinem/rust-cache/releases/tag/v2.9.1
        with:
          workspaces: backend
          shared-key: deploy-backend

      - name: Lint (clippy)
        if: steps.detect.outputs.backend == 'true'
        run: SQLX_OFFLINE=true cargo clippy -- -D warnings

      - name: Run tests
        if: steps.detect.outputs.backend == 'true'
        run: SQLX_OFFLINE=true cargo test

      - name: Generate OpenAPI schema
        if: steps.detect.outputs.backend == 'true'
        run: cargo run --bin generate_openapi

      - name: Check OpenAPI schema is up to date
        if: steps.detect.outputs.backend == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code docs/openapi.json; then
            echo "openapi.json が古い状態です。cargo run --bin generate_openapi を実行してコミットしてください。"
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.detect.outputs.backend == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0 https://github.com/docker/setup-buildx-action/releases/tag/v4.3.0

      - name: Build Docker image
        if: steps.detect.outputs.backend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0 https://github.com/docker/build-push-action/releases/tag/v7.3.0
        with:
          context: ./backend
          push: false
          tags: shoken-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate-frontend-types:
    name: Validate Frontend Types
    needs: test-and-build
    if: needs.test-and-build.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Generate frontend types
        working-directory: frontend
        run: npm run generate:types

      - name: Check frontend types are up to date
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code frontend/src/generated/api.ts; then
            echo "api.ts が古い状態です。npm run generate:types を実行してコミットしてください。"
            exit 1
          fi

      - name: TypeScript type check
        working-directory: frontend
        run: npm run typecheck

  deploy:
    name: Deploy to Fly.io
    needs: [test-and-build, validate-frontend-types]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1 https://github.com/superfly/flyctl-actions/releases/tag/v1

      - name: Deploy to Fly.io
        id: fly-deploy
        run: flyctl deploy --remote-only --label "GH_SHA=${GITHUB_SHA}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy failure diagnostics
        if: failure() && steps.fly-deploy.outcome == 'failure'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "::error::flyctl deploy failed. Previous running deployment was not modified. See diagnostic output below."
          echo "=== releases ==="
          flyctl releases --json | jq '.' || true
          echo "=== machine list ==="
          flyctl machine list --json | jq '.' || true
          exit 1
