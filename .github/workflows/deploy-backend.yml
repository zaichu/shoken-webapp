name: Backend CI / Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    outputs:
      backend: ${{ steps.detect.outputs.backend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7 https://github.com/actions/checkout/releases/tag/v7
        with:
          fetch-depth: 1

      - name: Detect backend changes
        id: detect
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v3 https://github.com/dorny/paths-filter/releases/tag/v4.0.1
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy-backend.yml'

      - name: Setup Rust toolchain
        if: steps.detect.outputs.backend == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1 https://github.com/actions-rust-lang/setup-rust-toolchain/releases/tag/v1

      - name: Cache Cargo registry & build
        if: steps.detect.outputs.backend == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5 https://github.com/actions/cache/releases/tag/v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Lint (clippy)
        if: steps.detect.outputs.backend == 'true'
        run: cargo clippy -- -D warnings

      - name: Run tests
        if: steps.detect.outputs.backend == 'true'
        run: cargo test

      - name: Generate OpenAPI schema
        if: steps.detect.outputs.backend == 'true'
        run: cargo run --bin generate_openapi

      - name: Check OpenAPI schema is up to date
        if: steps.detect.outputs.backend == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code docs/openapi.json; then
            echo "openapi.json が古い状態です。cargo run --bin generate_openapi を実行してコミットしてください。"
            exit 1
          fi

  validate-frontend-types:
    name: Validate Frontend Types
    needs: test-and-build
    if: needs.test-and-build.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7 https://github.com/actions/checkout/releases/tag/v7

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Generate frontend types
        working-directory: frontend
        run: npm run generate:types

      - name: Check frontend types are up to date
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code frontend/src/generated/api.ts; then
            echo "api.ts が古い状態です。npm run generate:types を実行してコミットしてください。"
            exit 1
          fi

      - name: TypeScript type check
        working-directory: frontend
        run: npm run typecheck

  deploy:
    name: Deploy to Fly.io
    needs: [test-and-build, validate-frontend-types]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7 https://github.com/actions/checkout/releases/tag/v7

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1 https://github.com/superfly/flyctl-actions/releases/tag/v1

      - name: Deploy to Fly.io
        id: fly-deploy
        run: flyctl deploy --remote-only --label "GH_SHA=${GITHUB_SHA}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy failure diagnostics
        if: failure() && steps.fly-deploy.outcome == 'failure'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "::error::flyctl deploy failed. Previous running deployment was not modified. See diagnostic output below."
          echo "=== releases ==="
          flyctl releases --json | jq '.' || true
          echo "=== machine list ==="
          flyctl machine list --json | jq '.' || true
          exit 1
