name: Mutation testing

# PR では base との差分だけを --in-diff で測定する。全件測定は workflow_dispatch で
# 手動起動し、クレート×シャードで並列化する(結果は artifact の mutants.out/ に残る)。
# PR 差分の missed は report ジョブが集約して PR コメントに出す。
# 必須チェック(Test & Build / Check, build, and E2E / PR gate)は変えない。

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/.cargo/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/mutation-testing.yml'
      - '.github/actions/rust-cache/**'
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4 https://github.com/dorny/paths-filter/releases/tag/v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          # Rust の変更を条件にするため、README や fixture だけの変更では起動しない
          filters: |
            backend:
              - "backend/**/*.rs"
              - "backend/Cargo.toml"
              - "backend/Cargo.lock"
              - "backend/.cargo/**"
              - "rust-toolchain.toml"
              - ".github/workflows/mutation-testing.yml"
              - ".github/actions/rust-cache/**"
              - "!**/*.md"
            frontend:
              - "frontend/**/*.rs"
              - "frontend/Cargo.toml"
              - "frontend/Cargo.lock"
              - "frontend/.cargo/**"
              - "rust-toolchain.toml"
              - ".github/workflows/mutation-testing.yml"
              - ".github/actions/rust-cache/**"
              - "!**/*.md"
            shared:
              - "shared/**/*.rs"
              - "shared/Cargo.toml"
              - "shared/.cargo/**"
              - "rust-toolchain.toml"
              - ".github/workflows/mutation-testing.yml"
              - ".github/actions/rust-cache/**"
              - "!**/*.md"

  shard:
    name: Run cargo-mutants on PR diff (${{ matrix.crate }}, shard ${{ matrix.shard }}/4)
    needs: changes
    # ジョブの if は matrix 展開より前に評価されるため、未変更クレートは matrix 自体から外す
    if: github.event_name == 'pull_request' && needs.changes.outputs.crates != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.crates) }}
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0 https://github.com/actions-rust-lang/setup-rust-toolchain/releases/tag/v2.0.0
        with:
          cache: false

      - name: Cache Cargo
        uses: ./.github/actions/rust-cache
        with:
          workspaces: ${{ matrix.crate }} -> target

      # rust-cache は既定で ~/.cargo/bin をキャッシュするため、同一バージョンでは
      # コンパイルを再実行せず即終了する
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants@27.1.0

      # --relative はカレントディレクトリ基準でパスを書き換えるため、
      # クレート内の --in-diff にそのまま渡せる
      - name: Make PR diff
        run: git diff --relative ${{ github.event.pull_request.base.sha }}...HEAD > mutants.diff

      # 差分に mutant 対象がない場合でも件数が step summary と outputs に残る。
      # 空 diff では --json が何も出力しないためフォールバックする
      - name: List mutants in PR diff
        id: list
        run: |
          count=$(cargo mutants --list --json --in-diff mutants.diff | jq 'length' || true)
          count=${count:-0}
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "- ${{ matrix.crate }}: PR 差分の対象 mutant は **${count}** 件" >> "$GITHUB_STEP_SUMMARY"

      - name: Run cargo-mutants on PR diff
        if: steps.list.outputs.count != '0'
        # 各クレートは単独 workspace のため、/tmp へのコピーでは ../shared と
        # ../../docs(openapi.json の include_str)を解決できずベースビルドが失敗する。
        # コピー先の隣に symlink を張る
        run: |
          set +e
          ln -sfn "$(realpath ../shared)" /tmp/shared
          ln -sfn "$(realpath ../docs)" /tmp/docs
          cargo mutants -j 4 --in-diff mutants.diff --shard ${{ matrix.shard }}/4
          code=$?
          set -e
          if [ "$code" -eq 2 ] || [ "$code" -eq 3 ]; then exit 0; fi
          exit "$code"

      # cargo-mutants を走らせなかった leg でも空ファイルを用意し、artifact が
      # 必要最低1件作られるようにする(report ジョブの download が失敗しないよう)
      - name: Ensure mutants.out lists exist
        if: always()
        run: |
          mkdir -p mutants.out
          for name in missed timeout; do
            if [ ! -f "mutants.out/$name.txt" ]; then : > "mutants.out/$name.txt"; fi
          done

      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 https://github.com/actions/upload-artifact/releases/tag/v7
        with:
          name: mutants-${{ matrix.crate }}-${{ matrix.shard }}-diff
          path: ${{ matrix.crate }}/mutants.out/

  report:
    name: Report missed mutants
    needs: [changes, shard]
    # diff 失敗/キャンセル時は測定が揃わないので集約しない(失敗は失敗のまま見せる)。
    # diff スキップ(対象変更なし)時も古い警告を消すため 0 件として動く
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      (needs.shard.result == 'success' || needs.shard.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # pull_request では checkout 既定の merge ref を読むので、導入PRで追加した
      # スクリプトも使える。fork PR の GITHUB_TOKEN は read-only・secret なしに
      # 制限されるため、PR 側のスクリプトを実行しても書き込み権限は悪用できない
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # download が条件付きでも dir を常に用意し、diff skipped の「正常な空」と
      # artifact 欠落の異常をスクリプト側で区別できるようにする
      - name: Prepare artifacts dir
        run: mkdir -p mutants-artifacts

      - name: Download mutants.out
        if: needs.shard.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 https://github.com/actions/download-artifact/releases/tag/v8.0.1
        with:
          pattern: mutants-*-*-diff
          path: mutants-artifacts

      - name: Update missed-mutants comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        env:
          MUTANTS_ARTIFACTS_DIR: mutants-artifacts
          MUTANTS_DIFF_RESULT: ${{ needs.shard.result }}
        with:
          script: |
            let reporter;
            try {
              reporter = require(
                `${process.env.GITHUB_WORKSPACE}/.github/scripts/mutation-comment.js`
              );
            } catch (error) {
              // スクリプト未配置は rollout 不備。緑のまま握り潰すと気づけないため失敗にする
              core.setFailed(`mutation-comment script not found: ${error.message}`);
              return;
            }
            try {
              await reporter.run({ github, context, core });
            } catch (error) {
              core.setFailed(error.stack ?? String(error));
            }

  baseline:
    name: Full cargo-mutants baseline ${{ matrix.crate }} shard ${{ matrix.shard }}/4
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [backend, frontend, shared]
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0 https://github.com/actions-rust-lang/setup-rust-toolchain/releases/tag/v2.0.0
        with:
          cache: false

      - name: Cache Cargo
        uses: ./.github/actions/rust-cache
        with:
          workspaces: ${{ matrix.crate }} -> target
          shared-key: mutants-${{ matrix.crate }}

      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants@27.1.0

      # cargo-mutants は missed mutant で終了コード 2、時間切れで 3 を返すが、baseline
      # 測定ではどちらも正常なため許容する。ビルド失敗等の他コードは失敗のまま。
      - name: Run cargo-mutants shard
        run: |
          set +e
          # diff ジョブと同じく ../shared と ../../docs パス依存対策の symlink を張る
          ln -sfn "$(realpath ../shared)" /tmp/shared
          ln -sfn "$(realpath ../docs)" /tmp/docs
          cargo mutants -j 4 --shard ${{ matrix.shard }}/4
          code=$?
          set -e
          if [ "$code" -eq 2 ] || [ "$code" -eq 3 ]; then exit 0; fi
          exit "$code"

      - name: Summarize mutants.out
        if: always()
        run: |
          echo "| outcome | count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for name in caught missed timeout unviable; do
            file="mutants.out/$name.txt"
            if [ -f "$file" ]; then count=$(wc -l < "$file"); else count=0; fi
            echo "| $name | $count |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 https://github.com/actions/upload-artifact/releases/tag/v7
        with:
          name: mutants-${{ matrix.crate }}-shard-${{ matrix.shard }}
          path: |
            ${{ matrix.crate }}/mutants.out/mutants.json
            ${{ matrix.crate }}/mutants.out/outcomes.json
            ${{ matrix.crate }}/mutants.out/caught.txt
            ${{ matrix.crate }}/mutants.out/missed.txt
            ${{ matrix.crate }}/mutants.out/unviable.txt
            ${{ matrix.crate }}/mutants.out/timeout.txt
          if-no-files-found: ignore
