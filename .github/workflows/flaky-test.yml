name: Frontend Flaky Test Detection

on:
  workflow_dispatch:

jobs:
  flaky-detection:
    name: Run tests twice for flaky detection
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run tests (1st run)
        run: npm test

      - name: Run tests (flaky detection – 2nd run)
        run: npm test
