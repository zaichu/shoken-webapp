name: Frontend Leptos CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect frontend-leptos changes
    runs-on: ubuntu-latest
    outputs:
      frontend_leptos: ${{ steps.filter.outputs.frontend_leptos }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3 https://github.com/dorny/paths-filter/releases/tag/v4.0.3
        with:
          filters: |
            frontend_leptos:
              - "frontend-leptos/**"
              - "docs/openapi.json"
              - "frontend/e2e/**"
              - ".github/workflows/frontend-leptos.yml"

  ci:
    name: Check, build, and E2E
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend_leptos == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-leptos

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0 https://github.com/actions-rust-lang/setup-rust-toolchain/releases/tag/v2.0.0
        with:
          toolchain: 1.96.0
          target: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 https://github.com/Swatinem/rust-cache/releases/tag/v2.9.2
        with:
          workspaces: frontend-leptos -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install trunk
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfLO https://github.com/trunk-rs/trunk/releases/download/v0.21.4/trunk-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfLO https://github.com/trunk-rs/trunk/releases/download/v0.21.4/trunk-x86_64-unknown-linux-gnu.tar.gz.sha256
          echo "$(tr -d '[:space:]' < trunk-x86_64-unknown-linux-gnu.tar.gz.sha256)  trunk-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf trunk-x86_64-unknown-linux-gnu.tar.gz
          install -m 755 trunk ~/.cargo/bin/

      - name: Setup frontend dependencies
        uses: ./.github/actions/setup-frontend

      - name: Install frontend-leptos dependencies
        run: npm ci

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy (wasm32)
        run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Run Clippy (host)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release bundle
        # trunk 0.21.4 は NO_COLOR=1 を予期しない引数として解釈するため解除する。
        run: env -u NO_COLOR trunk build --release --dist dist-release

      - name: Report compressed asset sizes
        run: |
          {
            echo "## frontend-leptos release asset sizes"
            echo
            echo "| Asset | Gzip size (bytes) |"
            echo "| --- | ---: |"
            find dist-release -type f \( -name '*.wasm' -o -name '*.js' -o -name '*.css' \) -print0 \
              | sort -z \
              | while IFS= read -r -d '' asset; do
                  size=$(gzip -c "$asset" | wc -c)
                  printf '| `%s` | %s |\n' "${asset#dist-release/}" "$size"
                done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore Playwright browsers cache
        id: playwright-browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Restore APT packages cache
        id: apt-packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/apt-packages
          key: ${{ runner.os }}-apt-playwright-ubuntu24.04-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-apt-playwright-ubuntu24.04-

      - name: Install APT packages (Playwright deps)
        run: |
          mkdir -p ~/apt-packages/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives=$HOME/apt-packages xvfb fonts-noto-color-emoji fonts-unifont libfontconfig1 libfreetype6 xfonts-cyrillic xfonts-scalable fonts-liberation fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2

      - name: Save APT packages cache
        if: github.ref == 'refs/heads/main' && steps.apt-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/apt-packages
          key: ${{ runner.os }}-apt-playwright-ubuntu24.04-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Save Playwright browsers cache
        if: github.ref == 'refs/heads/main' && steps.playwright-browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      # E2E の serve は test-results/dist-* を使い、dist-release/ のリリース成果物と混在させない。
      - name: Run existing E2E tests
        run: env -u NO_COLOR npx playwright test --config playwright.leptos.config.ts

      - name: Run receipts cache E2E tests
        run: env -u NO_COLOR npx playwright test --config playwright.receipts.config.ts

      - name: Build Vercel verification bundle
        run: env -u NO_COLOR trunk build --release --dist dist-vercel
        env:
          SHOKEN_WEBAPI_URL: https://shoken-backend.fly.dev

      - name: Run Vercel delivery E2E tests
        run: env -u NO_COLOR npx playwright test --config playwright.vercel.config.ts
