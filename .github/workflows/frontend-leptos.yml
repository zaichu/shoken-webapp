name: Frontend Leptos CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect frontend-leptos changes
    runs-on: ubuntu-latest
    outputs:
      frontend_leptos: ${{ steps.filter.outputs.frontend_leptos }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3 https://github.com/dorny/paths-filter/releases/tag/v4.0.3
        with:
          filters: |
            frontend_leptos:
              - "frontend-leptos/**"
              - "docs/openapi.json"
              - "frontend/e2e/**"
              - ".github/workflows/frontend-leptos.yml"

  ci:
    name: Check, build, and E2E
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend_leptos == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-leptos

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0 https://github.com/actions-rust-lang/setup-rust-toolchain/releases/tag/v2.0.0
        with:
          toolchain: 1.96.0
          target: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 https://github.com/Swatinem/rust-cache/releases/tag/v2.9.2
        with:
          workspaces: frontend-leptos -> target

      - name: Cache trunk
        id: trunk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cargo/bin/trunk
          key: ${{ runner.os }}-${{ runner.arch }}-trunk-0.21.4

      - name: Install trunk
        if: steps.trunk-cache.outputs.cache-hit != 'true'
        run: cargo install trunk --version 0.21.4 --locked

      - name: Setup frontend dependencies
        uses: ./.github/actions/setup-frontend

      - name: Install frontend-leptos dependencies
        run: npm ci

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release bundle
        # trunk 0.21.4 は NO_COLOR=1 を予期しない引数として解釈するため解除する。
        run: env -u NO_COLOR trunk build --release --dist dist-release

      - name: Report compressed asset sizes
        run: |
          {
            echo "## frontend-leptos release asset sizes"
            echo
            echo "| Asset | Gzip size (bytes) |"
            echo "| --- | ---: |"
            find dist-release -type f \( -name '*.wasm' -o -name '*.js' -o -name '*.css' \) -print0 \
              | sort -z \
              | while IFS= read -r -d '' asset; do
                  size=$(gzip -c "$asset" | wc -c)
                  printf '| `%s` | %s |\n' "${asset#dist-release/}" "$size"
                done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Playwright browsers
        id: playwright-browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Cache APT packages (Playwright deps)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3 https://github.com/awalsh128/cache-apt-pkgs-action/releases/tag/v1.6.3
        with:
          version: playwright-ubuntu24.04-chromium-${{ hashFiles('frontend/package-lock.json') }}
          packages: xvfb fonts-noto-color-emoji fonts-unifont libfontconfig1 libfreetype6 xfonts-cyrillic xfonts-scalable fonts-liberation fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2

      - name: Install Playwright browser
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # E2E は既定の dist/ を使い、dist-release/ のリリース成果物と混在させない。
      - name: Run existing E2E tests
        run: env -u NO_COLOR npx playwright test --config playwright.leptos.config.ts

      - name: Run receipts cache E2E tests
        run: env -u NO_COLOR npx playwright test --config playwright.receipts.config.ts
