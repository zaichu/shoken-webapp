name: Frontend Deploy

on:
  # 自動デプロイは Frontend CI(frontend.yml) からの呼び出しに一本化。
  # 手動起動は main 限定(deploy ジョブの if で拒否)
  workflow_call:
    inputs:
      use_prebuilt_dist:
        description: Frontend CI の vercel-dist artifact を再利用し、ビルドを省略する
        type: boolean
        required: true
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vercel-secrets:
    name: Check Vercel secrets
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check secrets presence
        id: check
        run: |
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              missing="${missing} ${name}"
            fi
          done
          if [[ -n "${missing}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel シークレットが未登録です(${missing# })。デプロイをスキップします"
            echo "Vercel シークレットが未登録です(\`${missing# }\`)。デプロイはスキップされました(失敗ではありません)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build and deploy to Vercel
    needs: [vercel-secrets]
    if: >-
      needs.vercel-secrets.outputs.available == 'true'
      && (github.event_name == 'workflow_call'
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    # workflow_call では github.workflow が呼び出し元(Frontend CI)になるため固定名を使う
    concurrency:
      group: frontend-deploy-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7

      # CI 呼び出し時は Frontend CI が検証済みの成果物をそのままデプロイする(二重ビルドをしない)
      - name: Download Vercel dist artifact
        if: inputs.use_prebuilt_dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7 https://github.com/actions/download-artifact/releases/tag/v7
        with:
          name: vercel-dist
          path: frontend/dist

      - name: Setup Rust
        if: inputs.use_prebuilt_dist != true
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0 https://github.com/actions-rust-lang/setup-rust-toolchain/releases/tag/v2.0.0
        with:
          target: wasm32-unknown-unknown

      - name: Cache Cargo
        if: inputs.use_prebuilt_dist != true
        uses: ./.github/actions/rust-cache
        with:
          workspaces: frontend -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install trunk
        if: inputs.use_prebuilt_dist != true
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfLO https://github.com/trunk-rs/trunk/releases/download/v0.21.4/trunk-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfLO https://github.com/trunk-rs/trunk/releases/download/v0.21.4/trunk-x86_64-unknown-linux-gnu.tar.gz.sha256
          echo "$(tr -d '[:space:]' < trunk-x86_64-unknown-linux-gnu.tar.gz.sha256)  trunk-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf trunk-x86_64-unknown-linux-gnu.tar.gz
          install -m 755 trunk ~/.cargo/bin/

      - name: Setup frontend dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 https://github.com/actions/setup-node/releases/tag/v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci は vercel build の installCommand(vercel-install.sh)でも走る
      - name: Install frontend dependencies
        if: inputs.use_prebuilt_dist != true
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@59.22.0 # https://github.com/vercel/vercel/releases/tag/vercel@59.22.0

      - name: Determine deploy target
        id: target
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            if [[ "${{ vars.LEPTOS_PRODUCTION_ENABLED }}" == "true" ]]; then
              echo "environment=production" >> "$GITHUB_OUTPUT"
            else
              echo "environment=preview" >> "$GITHUB_OUTPUT"
              echo "::notice::LEPTOS_PRODUCTION_ENABLED が 'true' ではないため preview にデプロイします(本番反映は切替決定まで無効)"
            fi
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
          fi

      # Vercel の Root Directory(frontend)はリポジトリのルートから解決されるため、CLI はルートで実行する
      - name: Pull Vercel project settings
        working-directory: .
        run: vercel pull --yes --environment="${{ steps.target.outputs.environment }}" --token "${VERCEL_TOKEN}"

      - name: Build output (vercel build)
        working-directory: .
        env:
          VERCEL_REUSE_DIST: ${{ inputs.use_prebuilt_dist }}
        run: |
          if [[ "${{ steps.target.outputs.environment }}" == "production" ]]; then
            vercel build --prod --token "${VERCEL_TOKEN}"
          else
            vercel build --token "${VERCEL_TOKEN}"
          fi

      - name: Deploy to Vercel
        id: deploy
        working-directory: .
        run: |
          if [[ "${{ steps.target.outputs.environment }}" == "production" ]]; then
            url="$(vercel deploy --prebuilt --prod --token "${VERCEL_TOKEN}" | grep -oE 'https://[^ ]+' | tail -n1)"
          else
            url="$(vercel deploy --prebuilt --token "${VERCEL_TOKEN}" | grep -oE 'https://[^ ]+' | tail -n1)"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed (${{ steps.target.outputs.environment }}): ${url}" >> "$GITHUB_STEP_SUMMARY"

      # synchronize ごとに新規コメントすると URL が積み上がるため、マーカー付きコメントを上書きする
      - name: Comment preview URL on PR
        if: github.event.pull_request != null && steps.deploy.outputs.url != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="<!-- frontend-preview-url -->"
          body="${marker}
          Frontend preview: ${{ steps.deploy.outputs.url }}"
          # --paginate はページ単位で jq 評価するため、各ページの一致 ID を最終行だけ採用する
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | tail -n1)
          if [[ -n "${existing}" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="${body}" > /dev/null
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "${body}"
          fi
