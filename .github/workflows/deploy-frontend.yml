name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vercel-secrets:
    name: Check Vercel secrets
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check secrets presence
        id: check
        run: |
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              missing="${missing} ${name}"
            fi
          done
          if [[ -n "${missing}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel シークレットが未登録です(${missing# })。デプロイをスキップします"
            echo "Vercel シークレットが未登録です(\`${missing# }\`)。デプロイはスキップされました(失敗ではありません)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build and deploy to Vercel
    needs: [vercel-secrets]
    # pull_request では PR 版 workflow が secrets 付きで動くため、書き込み権限のある投稿者以外では実行しない
    if: >-
      needs.vercel-secrets.outputs.available == 'true'
      && (github.ref == 'refs/heads/main'
        || (github.event_name == 'pull_request'
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # テストは PR と main の CI で済んでいるため回し直さず、そのコミットの CI の結果だけを確かめる
      # PR プレビューは検証用途のためゲートしない。push では CI と同時起動するので結論が出るまで待機する
      - name: Require passing CI on this commit
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 120); do
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=Check%2C%20build%2C%20and%20E2E" \
              --jq '.check_runs | sort_by(.started_at) | last | if . == null then "missing" else (.conclusion // "pending") end')
            case "${conclusion}" in
              success) exit 0 ;;
              missing|pending) sleep 15 ;;
              *)
                echo "::error::このコミットの Check, build, and E2E が成功していません(${conclusion})。デプロイしません"
                exit 1
                ;;
            esac
          done
          echo "::error::Frontend CI が 30 分以内に完了しませんでした(最終状態: ${conclusion})。デプロイしません"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0 https://github.com/actions-rust-lang/setup-rust-toolchain/releases/tag/v2.0.0
        with:
          toolchain: 1.96.0
          target: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 https://github.com/Swatinem/rust-cache/releases/tag/v2.9.2
        with:
          workspaces: frontend -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install trunk
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfLO https://github.com/trunk-rs/trunk/releases/download/v0.21.4/trunk-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfLO https://github.com/trunk-rs/trunk/releases/download/v0.21.4/trunk-x86_64-unknown-linux-gnu.tar.gz.sha256
          echo "$(tr -d '[:space:]' < trunk-x86_64-unknown-linux-gnu.tar.gz.sha256)  trunk-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf trunk-x86_64-unknown-linux-gnu.tar.gz
          install -m 755 trunk ~/.cargo/bin/

      - name: Setup frontend dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 https://github.com/actions/setup-node/releases/tag/v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@59.22.0 # https://github.com/vercel/vercel/releases/tag/vercel@59.22.0

      - name: Determine deploy target
        id: target
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            if [[ "${{ vars.LEPTOS_PRODUCTION_ENABLED }}" == "true" ]]; then
              echo "environment=production" >> "$GITHUB_OUTPUT"
            else
              echo "environment=preview" >> "$GITHUB_OUTPUT"
              echo "::notice::LEPTOS_PRODUCTION_ENABLED が 'true' ではないため preview にデプロイします(本番反映は切替決定まで無効)"
            fi
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
          fi

      # Vercel の Root Directory(frontend)はリポジトリのルートから解決されるため、CLI はルートで実行する
      - name: Pull Vercel project settings
        working-directory: .
        run: vercel pull --yes --environment="${{ steps.target.outputs.environment }}" --token "${VERCEL_TOKEN}"

      - name: Build output (vercel build)
        working-directory: .
        run: |
          if [[ "${{ steps.target.outputs.environment }}" == "production" ]]; then
            vercel build --prod --token "${VERCEL_TOKEN}"
          else
            vercel build --token "${VERCEL_TOKEN}"
          fi

      - name: Deploy to Vercel
        id: deploy
        working-directory: .
        run: |
          if [[ "${{ steps.target.outputs.environment }}" == "production" ]]; then
            url="$(vercel deploy --prebuilt --prod --token "${VERCEL_TOKEN}" | grep -oE 'https://[^ ]+' | tail -n1)"
          else
            url="$(vercel deploy --prebuilt --token "${VERCEL_TOKEN}" | grep -oE 'https://[^ ]+' | tail -n1)"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed (${{ steps.target.outputs.environment }}): ${url}" >> "$GITHUB_STEP_SUMMARY"

      # synchronize ごとに新規コメントすると URL が積み上がるため、マーカー付きコメントを上書きする
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="<!-- frontend-preview-url -->"
          body="${marker}
          Frontend preview: ${{ steps.deploy.outputs.url }}"
          # --paginate はページ単位で jq 評価するため --slurp で結合してから1件だけ取る
          existing=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq "[.[][] | select(.body | contains(\"${marker}\"))] | last | .id // empty")
          if [[ -n "${existing}" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="${body}" > /dev/null
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "${body}"
          fi
