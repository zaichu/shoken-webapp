name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3 https://github.com/dorny/paths-filter/releases/tag/v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            frontend:
              - "frontend/**"
              - "shared/**"
              - "rust-toolchain.toml"
              - "docs/openapi.json"
              - ".github/workflows/frontend.yml"
              - ".github/workflows/deploy-frontend.yml"
              - ".github/actions/rust-cache/**"
              - ".github/actions/setup-playwright/**"
              - "!**/*.md"

  build:
    name: Check and build
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0 https://github.com/actions-rust-lang/setup-rust-toolchain/releases/tag/v2.0.0
        with:
          cache: false
          target: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: ./.github/actions/rust-cache
        with:
          workspaces: frontend -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install trunk
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfLO https://github.com/trunk-rs/trunk/releases/download/v0.21.4/trunk-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfLO https://github.com/trunk-rs/trunk/releases/download/v0.21.4/trunk-x86_64-unknown-linux-gnu.tar.gz.sha256
          echo "$(tr -d '[:space:]' < trunk-x86_64-unknown-linux-gnu.tar.gz.sha256)  trunk-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf trunk-x86_64-unknown-linux-gnu.tar.gz
          install -m 755 trunk ~/.cargo/bin/

      - name: Setup frontend dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 https://github.com/actions/setup-node/releases/tag/v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check formatting
        run: cargo fmt --check

      - name: Check CSS tokens
        run: npm run check:css

      - name: Test test layout checker
        run: npm run test:test-layout

      - name: Check test layout
        run: npm run check:test-layout

      - name: Run Clippy (wasm32)
        run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Run Clippy (host)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build frontend bundle
        run: env -u NO_COLOR trunk build --release --dist dist-e2e

      - name: Report compressed asset sizes
        run: |
          {
            echo "## frontend release asset sizes"
            echo
            echo "| Asset | Gzip size (bytes) |"
            echo "| --- | ---: |"
            find dist-e2e -type f \( -name '*.wasm' -o -name '*.js' -o -name '*.css' \) -print0 \
              | sort -z \
              | while IFS= read -r -d '' asset; do
                  size=$(gzip -c "$asset" | wc -c)
                  printf '| `%s` | %s |\n' "${asset#dist-e2e/}" "$size"
                done
          } >> "$GITHUB_STEP_SUMMARY"

      # 本番 origin を埋めるのは vercel 配信検証用だけにする。E2E 用は API origin が
      # 空のまま(trunk serve と同じ同一オリジン)の dist を渡し、モック外の通信を外に出さない
      - name: Prepare Vercel delivery bundle
        run: |
          cp -r dist-e2e dist-release
          node scripts/prepare-vercel-dist.mjs dist-release

      - name: Upload E2E dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 https://github.com/actions/upload-artifact/releases/tag/v7
        with:
          name: e2e-dist
          path: frontend/dist-e2e
          retention-days: 1
          if-no-files-found: error

      - name: Upload Vercel dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 https://github.com/actions/upload-artifact/releases/tag/v7
        with:
          name: vercel-dist
          path: frontend/dist-release
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E (shard ${{ matrix.shard }}/3)
    needs: [changes, build]
    if: needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      LEPTOS_E2E_DIST_DIR: dist-e2e

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7

      - name: Setup frontend dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 https://github.com/actions/setup-node/releases/tag/v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Download E2E dist artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7 https://github.com/actions/download-artifact/releases/tag/v7
        with:
          name: e2e-dist
          path: frontend/dist-e2e

      - name: Setup Playwright environment
        id: playwright
        uses: ./.github/actions/setup-playwright

      # キャッシュの保存はこのジョブに一本化する(複数ジョブの同時保存はキー競合で失敗する)
      - name: Save APT packages cache
        if: matrix.shard == 1 && github.ref == 'refs/heads/main' && steps.playwright.outputs.apt_cache_hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/apt-packages
          key: ${{ steps.playwright.outputs.apt_cache_key }}

      - name: Save Playwright browsers cache
        if: matrix.shard == 1 && github.ref == 'refs/heads/main' && steps.playwright.outputs.browsers_cache_hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Run E2E tests
        run: env -u NO_COLOR npx playwright test --config playwright.leptos.config.ts --shard=${{ matrix.shard }}/3

  e2e-vercel:
    name: E2E (Vercel delivery)
    needs: [changes, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_DIST_DIR: dist-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7

      - name: Setup frontend dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 https://github.com/actions/setup-node/releases/tag/v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Download Vercel dist artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7 https://github.com/actions/download-artifact/releases/tag/v7
        with:
          name: vercel-dist
          path: frontend/dist-release

      - name: Setup Playwright environment
        uses: ./.github/actions/setup-playwright

      - name: Run Vercel delivery E2E tests
        run: env -u NO_COLOR npx playwright test --config playwright.vercel.config.ts

  ci:
    name: Check, build, and E2E
    needs: [changes, build, e2e, e2e-vercel]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify all required jobs succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_VERCEL_RESULT: ${{ needs['e2e-vercel'].result }}
        run: |
          ok=true
          report() {
            echo "$1: $2"
            if [ "$2" != "success" ]; then ok=false; fi
          }
          report changes "$CHANGES_RESULT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$FRONTEND_CHANGED" = "true" ]; then
            report build "$BUILD_RESULT"
            report e2e "$E2E_RESULT"
            report e2e-vercel "$E2E_VERCEL_RESULT"
          fi
          $ok || { echo "::error::required jobs did not succeed"; exit 1; }

  # デプロイはこの CI の成果物(vercel-dist)をそのまま使う。ビルドの重複を避けるため
  # 別系統ではなく同一 run 内の呼び出しにする。PR プレビューは deploy-frontend.yml の
  # pull_request トリガーが担当し、この run にはデプロイ用 secrets を載せない
  deploy:
    name: Deploy to Vercel
    needs: [changes, ci]
    # callee が pull-requests: write を要求するため caller でも許可が必要
    permissions:
      contents: read
      pull-requests: write
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
        || (github.event_name == 'push' && needs.changes.outputs.frontend == 'true'))
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      use_prebuilt_dist: true
    secrets: inherit
