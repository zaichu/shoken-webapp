name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'rust-toolchain.toml'
      - 'docs/openapi.json'
      - 'scripts/check-openapi.sh'
      - '.github/workflows/backend.yml'
      - '.github/actions/rust-cache/**'
      - '!**/*.md'
  # GITHUB_TOKEN による dependabot の自動マージでは push イベントが発火しないため、手動検証用に残す
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    outputs:
      backend: ${{ steps.gate.outputs.backend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7
        with:
          fetch-depth: 1

      - name: Detect backend changes
        id: detect
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3 https://github.com/dorny/paths-filter/releases/tag/v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            backend:
              - 'backend/**'
              - 'shared/**'
              - 'rust-toolchain.toml'
              - 'docs/openapi.json'
              - 'scripts/check-openapi.sh'
              - '.github/workflows/backend.yml'
              - '.github/actions/rust-cache/**'
              - '!**/*.md'

      # 手動実行は dependabot 自動マージ後の検証経路なので、直前コミットが frontend だけでも検証を通す
      - name: Resolve backend detection
        id: gate
        run: echo "backend=${{ steps.detect.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        if: steps.gate.outputs.backend == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0 https://github.com/actions-rust-lang/setup-rust-toolchain/releases/tag/v2.0.0
        with:
          cache: false

      - name: Cache Rust dependencies
        if: steps.gate.outputs.backend == 'true'
        uses: ./.github/actions/rust-cache
        with:
          workspaces: |
            backend -> target
            shared -> target
          shared-key: backend-ci

      - name: Check formatting
        if: steps.gate.outputs.backend == 'true'
        run: cargo fmt --check

      - name: Lint (clippy)
        if: steps.gate.outputs.backend == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        if: steps.gate.outputs.backend == 'true'
        run: cargo test

      - name: Check shared crate
        if: steps.gate.outputs.backend == 'true'
        run: |
          cargo fmt --manifest-path ../shared/Cargo.toml --check
          cargo clippy --manifest-path ../shared/Cargo.toml --all-features --all-targets -- -D warnings
          cargo test --manifest-path ../shared/Cargo.toml --all-features
          rustup target add wasm32-unknown-unknown
          cargo check --manifest-path ../shared/Cargo.toml --target wasm32-unknown-unknown

      - name: Check OpenAPI schema is up to date
        if: steps.gate.outputs.backend == 'true'
        working-directory: ${{ github.workspace }}
        run: bash scripts/check-openapi.sh

      - name: Install worker-build
        if: steps.gate.outputs.backend == 'true'
        run: cargo install --locked --version 0.8.7 worker-build

      - name: Build Worker bundle (wasm32)
        if: steps.gate.outputs.backend == 'true'
        run: worker-build --release
