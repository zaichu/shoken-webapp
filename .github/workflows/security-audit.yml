name: Security Audit

on:
  schedule:
    # 毎週月曜 09:00 JST（UTC 00:00）
    - cron: "0 0 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/Cargo.toml"
      - "backend/Cargo.lock"
      - "backend/audit.toml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "scripts/npm-audit-allowlist.mjs"
      - ".github/workflows/security-audit.yml"
  push:
    branches: [main]
    paths:
      - "backend/Cargo.toml"
      - "backend/Cargo.lock"
      - "backend/audit.toml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "scripts/npm-audit-allowlist.mjs"
      - ".github/workflows/security-audit.yml"

jobs:
  changes:
    name: Detect audit changes
    runs-on: ubuntu-latest
    outputs:
      cargo: ${{ steps.filter.outputs.cargo }}
      npm: ${{ steps.filter.outputs.npm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        with:
          filters: |
            cargo:
              - "backend/Cargo.toml"
              - "backend/Cargo.lock"
              - "backend/audit.toml"
              - ".github/workflows/security-audit.yml"
            npm:
              - "frontend/package.json"
              - "frontend/package-lock.json"
              - "scripts/npm-audit-allowlist.mjs"
              - ".github/workflows/security-audit.yml"

  cargo-audit:
    name: cargo audit (Rust)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      # SHA pin: actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0 https://github.com/rustsec/audit-check/releases/tag/v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: backend

  npm-audit:
    name: npm audit (Node.js)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # SHA pin: actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # SHA pin: actions/setup-node@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Run npm audit
        run: node ../scripts/npm-audit-allowlist.mjs
