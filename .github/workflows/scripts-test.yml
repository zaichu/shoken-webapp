name: Scripts CI

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/scripts-test.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  test:
    name: Test gate scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7
      - run: node --test .github/scripts/*.test.js
