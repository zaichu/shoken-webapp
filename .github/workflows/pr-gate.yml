name: PR gate

on:
  # fork PR では pull_request 系イベントの GITHUB_TOKEN が read-only に降格しステータスを書けないため pull_request_target を使う
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issue_comment:
  pull_request_review:
  pull_request_review_comment:
  # コメントの非表示/再表示では webhook が発火しないため、非表示後の再評価は手動で実行する
  workflow_dispatch:
    inputs:
      pr:
        description: 再評価する PR 番号
        required: true
        type: number

# issue_comment 等では実行の head SHA が PR の head にならないため、PR 番号で実行を見分ける
# " #" は YAML のコメント開始と解釈されるため必ずクォートする
run-name: "PR gate #${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr }}"

jobs:
  pr-gate:
    name: Evaluate PR gate
    runs-on: ubuntu-latest
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    steps:
      # イベントによっては PR 側や古い base のコードが取り出されるため、常に default ブランチ(スクリプト配置済み・信頼済み)を読む
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 https://github.com/actions/checkout/releases/tag/v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check linked issue and unresolved comments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        with:
          script: |
            try {
              const gate = require(
                `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-gate.js`
              );
              await gate.run({ github, context, core });
            } catch (error) {
              // 判定は commit status にだけ出す。評価自体の失敗でジョブを赤くしない
              core.warning(`PR gate evaluation failed: ${error.stack ?? error}`);
            }
