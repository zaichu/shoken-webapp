name: PR gate

on:
  # fork PR では pull_request 系イベントの GITHUB_TOKEN が read-only に降格しステータスを書けないため pull_request_target を使う(コードの checkout はしない)
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issue_comment:
  pull_request_review:
  pull_request_review_comment:
  # コメントの非表示/再表示では webhook が発火しないため、非表示後の再評価は手動で実行する
  workflow_dispatch:
    inputs:
      pr:
        description: 再評価する PR 番号
        required: true
        type: number

jobs:
  pr-gate:
    name: Evaluate PR gate
    runs-on: ubuntu-latest
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    steps:
      - name: Check linked issue and unresolved comments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        with:
          script: |
            const prNumber =
              context.payload.pull_request?.number ??
              context.payload.issue?.number ??
              Number(context.payload.inputs?.pr);
            const { owner, repo } = context.repo;

            const prQuery = `
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    body
                    headRefOid
                    isCrossRepository
                    closingIssuesReferences(first: 1) {
                      totalCount
                    }
                  }
                }
              }
            `;
            const listQuery = (field) => `
              query($owner: String!, $repo: String!, $pr: Int!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    ${field}(first: 100, after: $cursor) {
                      nodes {
                        isMinimized
                        body
                        url
                        author {
                          __typename
                          login
                        }
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }
              }
            `;

            const fetchAll = async (field) => {
              const nodes = [];
              let cursor = null;
              do {
                const result = await github.graphql(listQuery(field), {
                  owner,
                  repo,
                  pr: prNumber,
                  cursor,
                });
                const connection = result.repository.pullRequest[field];
                nodes.push(...connection.nodes.filter(Boolean));
                cursor = connection.pageInfo.hasNextPage
                  ? connection.pageInfo.endCursor
                  : null;
              } while (cursor);
              return nodes;
            };

            // イベントごとに実行が並列に立つため、判定は status を書く直前の最新状態で行う
            const evaluate = async () => {
              const prResult = await github.graphql(prQuery, {
                owner,
                repo,
                pr: prNumber,
              });
              const pr = prResult.repository.pullRequest;
              if (!pr) return null;

              const comments = await fetchAll('comments');
              const reviews = await fetchAll('reviews');

              const refNumbers = [
                ...new Set(
                  [...(pr.body ?? '').matchAll(/(?:Refs|Part of)\s+#(\d+)/gi)].map(
                    (m) => Number(m[1])
                  )
                ),
              ];
              let linked = pr.closingIssuesReferences.totalCount > 0;
              for (const n of refNumbers) {
                if (linked) break;
                try {
                  const result = await github.graphql(
                    `query($owner: String!, $repo: String!, $n: Int!) {
                      repository(owner: $owner, name: $repo) {
                        issue(number: $n) {
                          state
                        }
                      }
                    }`,
                    { owner, repo, n }
                  );
                  if (result.repository.issue) linked = true;
                } catch (error) {
                  // 実在しない番号や PR 番号は NOT_FOUND エラーになる → 紐づけなしとして扱う
                  if (!(error.errors ?? []).every((e) => e.type === 'NOT_FOUND')) {
                    throw error;
                  }
                }
              }

              // author=null(退会済みアカウント)は bot と判定できないため人のコメントとして扱う
              const isBot = (author) =>
                author?.__typename === 'Bot' ||
                (author?.login ?? '').endsWith('[bot]');
              const unresolved = [...comments, ...reviews].filter((node) => {
                const body = node.body ?? '';
                return (
                  !isBot(node.author) &&
                  !node.isMinimized &&
                  body.trim() !== '' &&
                  !body.includes('<!-- no-action -->')
                );
              });

              const problems = [];
              if (!linked) problems.push('Issue が紐づいていません');
              if (unresolved.length > 0) {
                problems.push(`未解決のコメントが ${unresolved.length} 件あります`);
              }

              core.info(`linked issue: ${linked}`);
              for (const node of unresolved) {
                core.info(`unresolved comment: ${node.url}`);
              }

              // ステータス説明は 140 字制限があるため、収まる分だけ URL を連結する
              const statusParts = [...problems];
              for (const node of unresolved) {
                if ([...statusParts, node.url].join(' / ').length <= 140) {
                  statusParts.push(node.url);
                }
              }
              const description =
                problems.length > 0
                  ? statusParts.join(' / ')
                  : 'Issue 紐づけ済み・未解決コメントなし';

              return {
                sha: pr.headRefOid,
                state: problems.length > 0 ? 'failure' : 'success',
                description: description.slice(0, 140),
                isCrossRepository: pr.isCrossRepository,
              };
            };

            const result = await evaluate();
            if (!result) {
              core.warning(`pull request #${prNumber} not found`);
              return;
            }

            try {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: result.sha,
                state: result.state,
                context: 'PR gate',
                description: result.description,
                target_url: `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`,
              });
            } catch (error) {
              // fork PR へのコメント/レビューイベントでは write が read に降格される。ステータスは pull_request_target か手動再実行で付け直す
              if (!result.isCrossRepository) throw error;
              core.warning(`commit status not written for fork PR: ${error.message}`);
            }
