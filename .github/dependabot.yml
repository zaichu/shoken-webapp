version: 2
updates:
  # npm（フロントエンド）
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      frontend-production:
        dependency-type: "production"
        patterns:
          - "*"
      frontend-development:
        dependency-type: "development"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "frontend"
    # typescript-eslintのpeer依存がTypeScript 7未対応のため除外。対応したら外す
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Cargo（バックエンド）
  - package-ecosystem: "cargo"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      backend-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "backend"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
