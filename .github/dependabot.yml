version: 2
updates:
  # npm（フロントエンド）
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      frontend-production:
        dependency-type: "production"
        patterns:
          - "*"
      frontend-development:
        dependency-type: "development"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "frontend"
  # Cargo（バックエンド）
  - package-ecosystem: "cargo"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      backend-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "backend"
  # Cargo（フロントエンド Leptos）
  - package-ecosystem: "cargo"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      frontend-rust-dependencies:
        patterns:
          - "*"
    # getrandom は推移的な 0.3 へ feature を届けるため 0.3 系列を直接指定している。0.4 に上げると wasm32 が壊れる
    ignore:
      - dependency-name: "getrandom"
        versions: [">=0.4"]
      # leptos(server_fn)が gloo-net 0.6 に依存しているため、0.7 を入れると wasm に両方が入る
      - dependency-name: "gloo-net"
        versions: [">=0.7"]
    labels:
      - "dependencies"
      - "frontend"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
