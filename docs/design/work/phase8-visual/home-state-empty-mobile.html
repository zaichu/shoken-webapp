<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ホーム(データなし) 新案 スマホ | 証券Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 数値は docs/design/work/phase5-codex/data/fixtures.json の架空データ(評価額 ¥28,593,148、評価損益 +¥1,552,488 +5.74%、年間予想配当(税引後) ¥3,163,438、受取(税引後) ¥3,163,438)。色は frontend/style/input.css の現行トークンのみ。面の塗りは棒グラフと割合の横棒だけ。 */
:root{
  --page:#ffffff; --card:#ffffff; --ink:#111827; --mut:#5f6b7a; --line:#e5e7eb;
  --navy:#0f2a4a; --accent:#1d4ed8; --up:#0b7a4b; --down:#c0362c;
  --bar-cur:#0f2a4a; --bar-prev:#64748b;
  --comp-a:#0f2a4a; --comp-b:#1d4ed8;
  --gold:#f2b33d;
}
html[data-theme="dark"]{
  --page:#0b1220; --card:#121b2c; --ink:#dfe6f2; --mut:#c2cddf; --line:#26334d;
  --navy:#dfe6f2; --accent:#8fb3f7; --up:#53d28a; --down:#f0857a;
  --bar-cur:#3987e5; --bar-prev:#9fb0cf;
  --comp-a:#3987e5; --comp-b:#d95926;
  --gold:#f2b33d;
}
@media (prefers-color-scheme: dark){
  html:not([data-theme]){ --page:#0b1220; --card:#121b2c; --ink:#dfe6f2; --mut:#c2cddf; --line:#26334d;
    --navy:#dfe6f2; --accent:#8fb3f7; --up:#53d28a; --down:#f0857a;
    --bar-cur:#3987e5; --bar-prev:#9fb0cf;
    --comp-a:#3987e5; --comp-b:#d95926; --gold:#f2b33d; }
}
*{box-sizing:border-box}
body{margin:0; background:var(--page); color:var(--ink);
  font-family:"Noto Sans JP","Hiragana Kaku Gothic ProN",Meiryo,sans-serif; font-weight:400;
  -webkit-text-size-adjust:100%}
.num{font-feature-settings:"tnum" 1; font-variant-numeric:tabular-nums}
/* 上部: ブランド左・アカウント文字右のみ。下に1pxの線 */
.top{border-bottom:1px solid var(--line)}
.top .inner{max-width:480px; margin:0 auto; padding:0 16px; display:flex; align-items:center; justify-content:space-between; min-height:52px; gap:12px}
.brand{font-size:15px; font-weight:700; color:var(--navy); white-space:nowrap}
.account{font-size:13px; color:var(--mut); white-space:nowrap; min-height:44px; display:flex; align-items:center}
.wrap{max-width:480px; margin:0 auto; padding:0 16px 120px}
/* 一番上: ラベル12灰 → 評価額30太字紺(左) → 損益16太字緑 → 基準日12灰。この3つだけ */
.hero{padding:20px 0 4px}
.hero .label{font-size:12px; color:var(--mut); margin:0; white-space:nowrap}
.hero .total{font-size:30px; font-weight:700; color:var(--navy); margin:4px 0 0; white-space:nowrap; text-align:left}
.hero .pl{font-size:16px; font-weight:700; margin:6px 0 0; white-space:nowrap}
.hero .date{font-size:12px; color:var(--mut); margin:6px 0 0; white-space:nowrap}
.up{color:var(--up)} .down{color:var(--down)}
/* カード: 白・角丸12・影なし・1px線・内側16・カード間12 */
.card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:12px; box-shadow:none}
.card h2{font-size:16px; font-weight:700; color:var(--navy); margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hrow{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.hrow .more{font-size:13px; color:var(--accent); white-space:nowrap; min-height:44px; display:flex; align-items:center}
/* 要約の行 */
.sum{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:12px 0 0}
.sum .recv{font-size:18px; font-weight:700; white-space:nowrap}
.sum .fore{font-size:13px; color:var(--mut); white-space:nowrap}
.sum .total{font-size:18px; font-weight:700; white-space:nowrap}
/* 明細の行: 高さ56px以上。左=名前15(2段目補足12灰)、右=金額15太字・右そろえ */
.rows{margin-top:4px}
.row{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 0; border-top:1px solid var(--line); min-height:56px}
.row:first-child{border-top:none}
.row .left{min-width:0; flex:1 1 auto}
.row .name{font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .sub{display:block; font-size:12px; color:var(--mut); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .amt{flex:none; font-size:15px; font-weight:700; text-align:right; white-space:nowrap}
.row .amt .rate{display:block; font-size:12px; font-weight:700; margin-top:2px}
/* 資産の横棒: 高さ8px・2色 */
.bar100{display:flex; height:8px; margin:14px 0 6px; overflow:hidden; border-radius:4px}
.bar100 .a{background:var(--comp-a); width:68.0%}
.bar100 .b{background:var(--comp-b); width:32.0%}
.subhead{font-size:13px; color:var(--mut); margin:14px 0 0; white-space:nowrap}
/* 棒グラフ: 高さ170px。税引後の単棒。月は1・4・7・10だけ11px。6月に税引後 ¥2,840,712 の値ラベル */
.bars{display:flex; align-items:stretch; height:170px; margin-top:8px}
.bars .g{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; min-width:0}
.bars .pair{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; width:100%; min-height:0}
.bars .b{width:8px; min-height:3px}
.bars .b.cur{background:var(--bar-cur)}
.bars .v{font-size:11px; color:var(--mut); white-space:nowrap; font-variant-numeric:tabular-nums}
.bars .m{font-size:11px; color:var(--mut); height:16px; line-height:16px; white-space:nowrap; margin-top:4px}
/* 最下部の控えめな文字リンク */
.footlink{display:flex; justify-content:center; align-items:center; min-height:44px; margin-top:20px; font-size:13px; color:var(--accent); white-space:nowrap}
/* 下に固定のナビ: 現行と同じ4項目。アイコン+文字。各44px以上 */
.bottomnav{position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--page); border-top:1px solid var(--line); z-index:10}
.bottomnav a{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:60px; padding:8px 0 calc(8px + env(safe-area-inset-bottom)); font-size:11px; color:var(--mut); text-decoration:none; white-space:nowrap}
.bottomnav a.here{color:var(--accent); font-weight:700}
</style>
</head>
<body>
<header class="top"><div class="inner">
  <span class="brand">証券Web</span><span class="account">アカウント</span>
</div></header>

<div class="wrap">
  <div class="hero">
    <p class="label">評価額</p>
    <p class="total num">¥28,593,148</p>
    <p class="pl num up">+¥1,552,488 +5.74%</p>
    <p class="date num">価格基準日 2026/11/13</p>
  </div>

  <section class="card" aria-label="今年の配当金">
    <div class="hrow"><h2>今年の配当金</h2><span class="more">取引明細で見る ›</span></div>
    <div class="rows">
      <div class="row"><div class="left"><div class="name">今年の配当データがありません</div><span class="sub">配当金明細をCSVで追加してください</span></div></div>
    </div>
  </section>

  <section class="card" aria-label="資産の内訳">
    <div class="hrow"><h2>資産の内訳</h2><span class="more">資産管理 ›</span></div>
    <div class="rows">
      <div class="row"><div class="left"><div class="name">資産データがありません</div><span class="sub">CSVファイルを取り込むと表示されます</span></div></div>
    </div>
  </section>

  <section class="card" aria-label="最近の配当入金">
    <div class="hrow"><h2>最近の配当入金</h2><span class="more">すべて見る ›</span></div>
    <div class="rows">
      <div class="row"><div class="left"><div class="name">データがありません</div><span class="sub">配当金明細をCSVで追加してください</span></div></div>
    </div>
  </section>

  <section class="card" aria-label="評価損益の大きい銘柄">
    <div class="hrow"><h2>評価損益の大きい銘柄</h2><span class="more">資産管理 ›</span></div>
    <div class="rows">
      <div class="row"><div class="left"><div class="name">データがありません</div><span class="sub">CSVファイルを取り込むと表示されます</span></div></div>
    </div>
  </section>

  <div class="footlink"><span>CSVファイルの取り込み ›</span></div>
</div>

<nav class="bottomnav" aria-label="下ナビ">
  <a class="here" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>ホーム</a>
  <a href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-8"/><path d="M22 20H2"/></svg>資産管理</a>
  <a href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>取引明細</a>
  <a href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>銘柄検索</a>
</nav>
<script>
try{const t=new URLSearchParams(location.search).get('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
</script>
</body>
</html>
