<!doctype html>
<html lang="ja" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共通部品見本</title><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:12px;background:var(--page);color:var(--text);font-family:var(--font-sans)}header{display:flex;justify-content:space-between;align-items:center;max-width:1440px;margin:auto}button,select{font:inherit;min-height:44px;padding:8px 12px;background:var(--surface);color:var(--text);border:1px solid var(--border-strong);border-radius:var(--radius-md)}.frame{margin:16px auto;max-width:100%;border:1px solid var(--border-strong);background:var(--page);overflow:hidden}iframe{display:block;width:100%;height:844px;border:0}</style></head><body><header><strong>共通部品見本</strong><div><label>幅 <select id="width"><option value="1280">PC 1280px</option><option value="390">スマホ 390px</option></select></label> <button id="theme">ダーク表示</button></div></header><div class="frame" id="frame"><iframe title="共通部品見本" src="components.html"></iframe></div><script>const frame=document.querySelector("#frame"),iframe=frame.querySelector("iframe"),width=document.querySelector("#width"),theme=document.querySelector("#theme");function render(){frame.style.width=`${Number(width.value)+2}px`;iframe.src="components.html"+(document.documentElement.dataset.theme==="dark"?"?dark":"")}width.onchange=render;theme.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==="light"?"dark":"light";theme.textContent=document.documentElement.dataset.theme==="light"?"ダーク表示":"ライト表示";render()};render()</script></body></html>
