[package]
name = "shared"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false

# backend/frontend 両方から使う wire 型のみを置く。既定では serde 系だけに留め、
# backend 専用の derive は feature で有効化する（wasm32 に sqlx/axum 系を混入させない）。
[features]
default = []
utoipa = ["dep:utoipa"]
sqlx = ["dep:sqlx"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
utoipa = { version = "6", optional = true }
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["derive"] }
