[package]
name = "shared"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[lints.clippy]
mod_module_files = "warn"
use_self = "warn"
missing_const_for_fn = "warn"
manual_let_else = "warn"
manual_is_variant_and = "warn"
option_if_let_else = "warn"
semicolon_if_nothing_returned = "warn"
items_after_statements = "warn"
unnested_or_patterns = "warn"
ignored_unit_patterns = "warn"
useless_let_if_seq = "warn"
single_match_else = "warn"
uninlined_format_args = "warn"
literal_string_with_formatting_args = "warn"
string_lit_as_bytes = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
manual_string_new = "warn"
explicit_iter_loop = "warn"
needless_collect = "warn"
format_collect = "warn"
or_fun_call = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
needless_pass_by_value = "warn"
unused_async = "warn"
unused_async_trait_impl = "warn"
unwrap_used = "warn"
expect_used = "warn"

[lints.cargo]
unused_dependencies = "warn"

# backend/frontend 両方から使う wire 型のみを置く。既定では serde 系だけに留め、
# backend 専用の derive は feature で有効化する（wasm32 に sqlx/axum 系を混入させない）。
# `typed` を有効にすると id/日付フィールドが uuid/chrono 型になる。
# 既定（frontend 向け）は String のまま受け、chrono/uuid をリンクしない。
# uuid は v4(getrandom) を切って serde 化だけに留める（wasm32 で生成しないため）。
# chrono も clock を切り、日付型の serde だけを使う。
[features]
default = []
typed = ["dep:chrono", "dep:uuid"]
utoipa = ["dep:utoipa", "typed"]
postgres = [
    "dep:bytes",
    "dep:postgres-types",
    "typed",
]
# `Validate` 実装が必要な DTO がある場合に backend だけが有効化する
validate = ["dep:validator"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
bytes = { version = "1", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"], optional = true }
rust_decimal = { version = "1", features = ["serde-float", "serde-arbitrary-precision"] }
uuid = { version = "1", default-features = false, features = ["serde", "std"], optional = true }
utoipa = { version = "6", optional = true, features = ["chrono", "uuid"] }
postgres-types = { version = "0.2", optional = true, features = [
    "derive",
    "with-chrono-0_4",
    "with-uuid-1",
] }
validator = { version = "0.21.0", optional = true }

[dev-dependencies]
rust_decimal_macros = "1.40.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std", "bit-set"] }
